# Serves the dashboard, and passes /api to the backend, so the browser talks
# to one address (no CORS). "api" is the backend's name in docker-compose.yml
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a hash in their name, so they can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other address is a page of the app (like /workouts/123):
    # send index.html and let React pick the page
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
