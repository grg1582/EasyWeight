[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "easyweight"
version = "0.2.0"
description = "Rep counter for a smart mirror: recognizes the exercise and counts reps from a webcam"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mediapipe",
    "numpy",
    "opencv-python",
    "pillow",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
easyweight = "easyweight.app:run"
easyweight-replay = "easyweight.replay:main"

[tool.setuptools]
packages = ["easyweight"]

[tool.setuptools.package-data]
easyweight = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]  # a short lambda is fine

[tool.ruff.lint.isort]
known-first-party = ["easyweight", "poses"]
