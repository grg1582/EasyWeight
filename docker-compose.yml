# The whole system, with one command:
#
#   docker compose up --build
#
# Dashboard:  http://localhost:8080
# API:        http://localhost:8000      interactive docs: http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: easyweight
      POSTGRES_PASSWORD: easyweight
      POSTGRES_DB: easyweight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyweight"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://easyweight:easyweight@db:5432/easyweight
      # Signs login tokens. Fine for your own computer; set a long random one
      # anywhere else (for example in a .env file next to this one)
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production}
      # Each end-to-end test run signs up new users; allow many on your computer
      SIGNUPS_PER_HOUR: 1000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
