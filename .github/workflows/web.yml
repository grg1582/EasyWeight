name: Web

on:
  push:
    paths: ["web/**", "backend/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "backend/**", ".github/workflows/web.yml"]

jobs:
  test:
    # Type check, component tests, and a production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # A real browser against the real backend and database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: easyweight
          POSTGRES_PASSWORD: easyweight
          POSTGRES_DB: easyweight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U easyweight"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://easyweight:easyweight@localhost:5432/easyweight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start the backend
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
          uvicorn easyweight_api.main:app --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        run: cat backend.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
